name: proof-local
services:
  proof:
    build: .
    ports:
      - "127.0.0.1:3020:4000"
    environment:
      PROOF_PUBLIC_BASE_URL: http://localhost:3020
      PROOF_PUBLIC_ORIGIN: http://localhost:3020
      PROOF_CORS_ALLOW_ORIGINS: http://localhost:3020,http://127.0.0.1:3020
      COLLAB_PUBLIC_BASE_URL: ws://localhost:3020/ws
    volumes:
      - proof-data:/data
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(async r=>{const h=await r.json();process.exit(r.ok&&h.ok&&h.collab.enabled?0:1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
volumes:
  proof-data:
